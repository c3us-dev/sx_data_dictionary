[project]
name = "sx-data-dictionary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "c3us-dev", email = "ccorbridge@ceeus.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0"
]

[project.scripts]
sx-data-dictionary = "sx_data_dictionary:main"
sx-om-dict-loader = "sx_data_dictionary.openmetadata_loader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pytest>=8.4.0",
    "ruff>=0.11.13",
]
